<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shell &amp; Lug — Drum Tuner</title>
<meta name="description" content="A mic-based drum tuning workbench: measure each lug against a target pitch and even out the head." />
<link rel="icon" href="data:," />
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #151009; min-height: 100vh; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect, useMemo, useCallback } = React;


/* ---------------------------------------------------------
   SHELL & LUG — a drum tuning workbench
   Pitch detection: time-domain autocorrelation over the mic
   input, referenced against a target frequency per drum/size.
   Falls back to manual Hz entry if the mic isn't available.
--------------------------------------------------------- */

const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

function freqToNote(freq) {
  if (!freq || freq <= 0) return null;
  const midi = 69 + 12 * Math.log2(freq / 440);
  const rounded = Math.round(midi);
  const name = NOTE_NAMES[((rounded % 12) + 12) % 12];
  const octave = Math.floor(rounded / 12) - 1;
  return `${name}${octave}`;
}

function centsOff(freq, target) {
  if (!freq || !target) return null;
  return Math.round(1200 * Math.log2(freq / target));
}

function ordinal(n) {
  const s = ["th", "st", "nd", "rd"];
  const v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

// Autocorrelation pitch detector over a time-domain buffer.
function autoCorrelate(buffer, sampleRate) {
  const SIZE = buffer.length;
  let sumSq = 0;
  for (let i = 0; i < SIZE; i++) sumSq += buffer[i] * buffer[i];
  const rms = Math.sqrt(sumSq / SIZE);
  if (rms < 0.008) return null;

  // trim near-silent head/tail
  let start = 0,
    end = SIZE - 1;
  const thresh = 0.2;
  while (start < SIZE / 2 && Math.abs(buffer[start]) < thresh) start++;
  while (end > SIZE / 2 && Math.abs(buffer[end]) < thresh) end--;
  const trimmed = buffer.slice(start, end);
  const n = trimmed.length;
  if (n < 8) return null;

  const c = new Float32Array(n);
  for (let lag = 0; lag < n; lag++) {
    let sum = 0;
    for (let i = 0; i < n - lag; i++) sum += trimmed[i] * trimmed[i + lag];
    c[lag] = sum;
  }

  let d = 0;
  while (d + 1 < n && c[d] > c[d + 1]) d++;

  let maxVal = -1,
    maxPos = -1;
  for (let i = d; i < n; i++) {
    if (c[i] > maxVal) {
      maxVal = c[i];
      maxPos = i;
    }
  }
  if (maxPos <= 0 || maxPos >= n - 1) return null;

  const x1 = c[maxPos - 1],
    x2 = c[maxPos],
    x3 = c[maxPos + 1];
  const a = (x1 + x3 - 2 * x2) / 2;
  const b = (x3 - x1) / 2;
  const shift = a ? -b / (2 * a) : 0;
  const period = maxPos + shift;
  if (period <= 0) return null;

  const freq = sampleRate / period;
  if (freq < 25 || freq > 700) return null;
  return freq;
}

function starOrder(n) {
  const step = Math.floor(n / 2);
  const order = [];
  const seen = new Set();
  let idx = 0;
  for (let i = 0; i < n; i++) {
    while (seen.has(idx)) idx = (idx + 1) % n;
    order.push(idx);
    seen.add(idx);
    idx = (idx + step) % n;
  }
  return order;
}

const DRUM_PRESETS = {
  kick: {
    label: "Kick Drum",
    diameters: [18, 20, 22, 24],
    freqFor: (d) => ({ 18: 82, 20: 73, 22: 62, 24: 55 }[d]),
  },
  snare: {
    label: "Snare Drum",
    diameters: [10, 12, 13, 14, 15],
    freqFor: (d) => ({ 10: 330, 12: 262, 13: 247, 14: 220, 15: 196 }[d]),
  },
  racktom: {
    label: "Rack Tom",
    diameters: [8, 10, 12, 13, 14],
    freqFor: (d) => ({ 8: 294, 10: 247, 12: 196, 13: 175, 14: 156 }[d]),
  },
  floortom: {
    label: "Floor Tom",
    diameters: [14, 16, 18],
    freqFor: (d) => ({ 14: 147, 16: 110, 18: 92 }[d]),
  },
};

const SENSITIVITY = {
  low: { onset: 0.055, sustain: 0.026 },
  med: { onset: 0.032, sustain: 0.015 },
  high: { onset: 0.018, sustain: 0.009 },
};

function lugColor(cents) {
  if (cents == null) return "#3A342B";
  const a = Math.abs(cents);
  if (a <= 8) return "#7FA65A";
  if (a <= 20) return "#C9A227";
  return cents < 0 ? "#5B8CB8" : "#C1573A";
}

function statusLabel(cents) {
  if (cents == null) return "not measured";
  const a = Math.abs(cents);
  const dir = cents < 0 ? "flat" : cents > 0 ? "sharp" : "on";
  if (a <= 8) return "in tune";
  return `${cents > 0 ? "+" : ""}${cents}¢ ${dir}`;
}

function DrumTuner() {
  const [drumType, setDrumType] = useState("snare");
  const [diameter, setDiameter] = useState(14);
  const [lugCount, setLugCount] = useState(8);
  const [targetFreq, setTargetFreq] = useState(DRUM_PRESETS.snare.freqFor(14));
  const [customMode, setCustomMode] = useState(false);
  const [customInput, setCustomInput] = useState("");
  const [sensitivity, setSensitivity] = useState("med");

  const [lugs, setLugs] = useState(() => Array(8).fill(null).map(() => ({ measured: false, freq: null })));
  const [armedIndex, setArmedIndex] = useState(0);

  const [listening, setListening] = useState(false);
  const [micError, setMicError] = useState(null);
  const [liveFreq, setLiveFreq] = useState(null);
  const [liveRms, setLiveRms] = useState(0);
  const [manualHz, setManualHz] = useState("");

  const audioCtxRef = useRef(null);
  const analyserRef = useRef(null);
  const streamRef = useRef(null);
  const rafRef = useRef(null);
  const bufRef = useRef(null);
  const frameCountRef = useRef(0);
  const capturingRef = useRef(false);
  const samplesRef = useRef([]);
  const lastCaptureEndRef = useRef(0);
  const armedIndexRef = useRef(0);
  const lugsRef = useRef(lugs);
  const sensRef = useRef(SENSITIVITY.med);

  useEffect(() => {
    lugsRef.current = lugs;
  }, [lugs]);
  useEffect(() => {
    sensRef.current = SENSITIVITY[sensitivity];
  }, [sensitivity]);
  useEffect(() => {
    armedIndexRef.current = armedIndex;
  }, [armedIndex]);

  const tuningOrder = useMemo(() => starOrder(lugCount), [lugCount]);
  const seqByIndex = useMemo(() => {
    const arr = new Array(lugCount);
    tuningOrder.forEach((idx, pos) => (arr[idx] = pos + 1));
    return arr;
  }, [tuningOrder, lugCount]);

  const resetLugs = useCallback(
    (n, firstArm) => {
      const fresh = Array(n).fill(null).map(() => ({ measured: false, freq: null }));
      setLugs(fresh);
      lugsRef.current = fresh;
      const arm = firstArm != null ? firstArm : starOrder(n)[0];
      setArmedIndex(arm);
      armedIndexRef.current = arm;
      capturingRef.current = false;
      samplesRef.current = [];
    },
    []
  );

  // reconfigure lugs when count changes
  useEffect(() => {
    resetLugs(lugCount);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [lugCount]);

  // recompute suggested target when type/diameter changes (unless custom)
  useEffect(() => {
    if (!customMode) {
      const f = DRUM_PRESETS[drumType].freqFor(diameter);
      if (f) setTargetFreq(f);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [drumType, diameter, customMode]);

  const finalizeCapture = useCallback(
    (index, freq) => {
      setLugs((prev) => {
        const next = prev.map((l, i) => (i === index ? { measured: true, freq } : l));
        lugsRef.current = next;
        return next;
      });
      const nextIdx = tuningOrder.find((idx) => idx !== index && !(lugsRef.current[idx] && lugsRef.current[idx].measured));
      // find first unmeasured, excluding the one we just set (state not yet flushed to ref)
      let candidate = null;
      for (const idx of tuningOrder) {
        if (idx === index) continue;
        const l = lugsRef.current[idx];
        if (!l || !l.measured) {
          candidate = idx;
          break;
        }
      }
      setArmedIndex(candidate);
      armedIndexRef.current = candidate;
    },
    [tuningOrder]
  );

  const tick = useCallback(() => {
    const analyser = analyserRef.current;
    const audioCtx = audioCtxRef.current;
    if (!analyser || !audioCtx) return;
    const buf = bufRef.current;
    analyser.getFloatTimeDomainData(buf);

    let sumSq = 0;
    for (let i = 0; i < buf.length; i++) sumSq += buf[i] * buf[i];
    const rms = Math.sqrt(sumSq / buf.length);

    const { onset, sustain } = sensRef.current;
    let freq = null;
    if (rms > sustain) {
      freq = autoCorrelate(buf, audioCtx.sampleRate);
    }

    frameCountRef.current++;
    if (frameCountRef.current % 3 === 0) {
      setLiveFreq(freq);
      setLiveRms(rms);
    }

    const now = performance.now();
    if (
      !capturingRef.current &&
      armedIndexRef.current != null &&
      rms > onset &&
      now - lastCaptureEndRef.current > 400
    ) {
      capturingRef.current = true;
      samplesRef.current = [];
    }

    if (capturingRef.current) {
      if (freq) samplesRef.current.push(freq);
      if (rms < sustain || samplesRef.current.length > 90) {
        capturingRef.current = false;
        lastCaptureEndRef.current = now;
        if (samplesRef.current.length >= 3) {
          const sorted = [...samplesRef.current].sort((a, b) => a - b);
          const median = sorted[Math.floor(sorted.length / 2)];
          finalizeCapture(armedIndexRef.current, median);
        }
      }
    }

    rafRef.current = requestAnimationFrame(tick);
  }, [finalizeCapture]);

  const startListening = async () => {
    setMicError(null);
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setMicError("Microphone access isn't available here. You can still enter readings by hand below.");
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
      });
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      const audioCtx = new AudioContextClass();
      const source = audioCtx.createMediaStreamSource(stream);
      const analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      source.connect(analyser);

      streamRef.current = stream;
      audioCtxRef.current = audioCtx;
      analyserRef.current = analyser;
      bufRef.current = new Float32Array(analyser.fftSize);
      frameCountRef.current = 0;
      lastCaptureEndRef.current = 0;
      capturingRef.current = false;

      setListening(true);
      rafRef.current = requestAnimationFrame(tick);
    } catch (err) {
      setMicError("Microphone permission was denied or unavailable. You can still enter readings by hand below.");
    }
  };

  const stopListening = useCallback(() => {
    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    rafRef.current = null;
    if (streamRef.current) streamRef.current.getTracks().forEach((t) => t.stop());
    if (audioCtxRef.current) audioCtxRef.current.close();
    streamRef.current = null;
    audioCtxRef.current = null;
    analyserRef.current = null;
    setListening(false);
    setLiveFreq(null);
    setLiveRms(0);
  }, []);

  useEffect(() => stopListening, [stopListening]);

  const nudgeTarget = (semitones) => {
    setCustomMode(true);
    setTargetFreq((f) => Math.round(f * Math.pow(2, semitones / 12) * 10) / 10);
  };

  const applyCustomHz = () => {
    const v = parseFloat(customInput);
    if (v > 0 && v < 1000) {
      setCustomMode(true);
      setTargetFreq(v);
    }
  };

  const revertToSuggested = () => {
    setCustomMode(false);
    const f = DRUM_PRESETS[drumType].freqFor(diameter);
    if (f) setTargetFreq(f);
  };

  const armLug = (i) => {
    setArmedIndex(i);
    armedIndexRef.current = i;
  };

  const saveManual = () => {
    const v = parseFloat(manualHz);
    if (v > 0 && v < 1000 && armedIndex != null) {
      finalizeCapture(armedIndex, v);
      setManualHz("");
    }
  };

  const cx = 150,
    cy = 150,
    r = 112;
  const lugPositions = useMemo(
    () =>
      Array.from({ length: lugCount }, (_, i) => {
        const angle = ((-90 + (360 / lugCount) * i) * Math.PI) / 180;
        return { x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) };
      }),
    [lugCount]
  );

  const liveCents = liveFreq ? centsOff(liveFreq, targetFreq) : null;
  const needleCents = Math.max(-50, Math.min(50, liveCents || 0));
  const needleDeg = (needleCents / 50) * 62;

  const measuredFreqs = lugs.filter((l) => l.measured).map((l) => l.freq);
  let spread = null,
    spreadLabel = "";
  if (measuredFreqs.length >= 2) {
    spread = Math.round(1200 * Math.log2(Math.max(...measuredFreqs) / Math.min(...measuredFreqs)));
    spreadLabel = spread <= 10 ? "excellent" : spread <= 20 ? "good" : spread <= 35 ? "fair" : "uneven";
  }
  const allMeasured = lugs.length > 0 && lugs.every((l) => l.measured);

  const armedLug = armedIndex != null ? lugs[armedIndex] : null;
  const armedCents = armedLug && armedLug.measured ? centsOff(armedLug.freq, targetFreq) : null;

  const levelPct = Math.min(100, Math.round((liveRms / 0.22) * 100));

  return (
    <div style={{ minHeight: "100%", background: "#151009" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; }
        .st-root {
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
          color: #EDE6D8;
          max-width: 560px;
          margin: 0 auto;
          padding: 20px 16px 40px;
        }
        .st-eyebrow {
          font-family: 'Inter', sans-serif;
          font-size: 11px;
          letter-spacing: 0.18em;
          text-transform: uppercase;
          color: #8A8072;
          margin: 0 0 2px;
        }
        .st-title {
          font-family: 'Oswald', 'Arial Narrow', sans-serif;
          font-weight: 700;
          font-size: 30px;
          letter-spacing: 0.03em;
          margin: 0 0 18px;
          color: #EDE6D8;
        }
        .st-title span { color: #C9A227; }
        .st-card {
          background: #1F1912;
          border: 1px solid #2E2519;
          border-radius: 10px;
          padding: 14px;
          margin-bottom: 14px;
        }
        .st-label {
          font-size: 11px;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          color: #8A8072;
          margin-bottom: 8px;
          font-weight: 600;
        }
        .st-pillrow { display: flex; flex-wrap: wrap; gap: 6px; }
        .st-pill {
          font-family: 'Inter', sans-serif;
          font-size: 13px;
          font-weight: 600;
          padding: 7px 12px;
          border-radius: 999px;
          border: 1px solid #3A3225;
          background: #171209;
          color: #C7BFAF;
          cursor: pointer;
          touch-action: manipulation;
        }
        .st-pill:focus-visible { outline: 2px solid #C9A227; outline-offset: 2px; }
        .st-pill.active {
          background: #C9A227;
          border-color: #C9A227;
          color: #171209;
        }
        .st-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
        .st-target {
          font-family: 'Oswald', sans-serif;
          font-size: 26px;
          font-weight: 600;
          color: #EDE6D8;
        }
        .st-target small { font-size: 13px; color: #8A8072; font-family: 'Inter', sans-serif; font-weight: 500; }
        .st-nudge {
          width: 32px; height: 32px; border-radius: 8px;
          background: #171209; border: 1px solid #3A3225; color: #C9A227;
          font-size: 16px; font-weight: 700; cursor: pointer; touch-action: manipulation;
        }
        .st-nudge:focus-visible { outline: 2px solid #C9A227; outline-offset: 2px; }
        .st-link-btn {
          background: none; border: none; color: #7FA65A; font-size: 12px;
          text-decoration: underline; cursor: pointer; padding: 2px;
        }
        .st-input {
          background: #171209; border: 1px solid #3A3225; color: #EDE6D8;
          border-radius: 6px; padding: 7px 9px; font-size: 14px; width: 90px;
          font-family: 'Inter', sans-serif;
        }
        .st-input:focus-visible { outline: 2px solid #C9A227; }
        .st-btn {
          font-family: 'Inter', sans-serif;
          font-weight: 700; font-size: 13px; letter-spacing: 0.03em;
          padding: 10px 16px; border-radius: 8px; border: 1px solid #C9A227;
          background: #C9A227; color: #171209; cursor: pointer; touch-action: manipulation;
        }
        .st-btn.secondary { background: transparent; color: #C9A227; }
        .st-btn.ghost { background: transparent; color: #8A8072; border-color: #3A3225; }
        .st-btn:focus-visible { outline: 2px solid #7FA65A; outline-offset: 2px; }
        .st-diagram-wrap { display: flex; justify-content: center; }
        .st-lug { cursor: pointer; touch-action: manipulation; }
        .st-lug:focus-visible circle.visible { stroke: #EDE6D8; stroke-width: 2.5; }
        .st-armed-pulse { animation: pulse 1.4s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
        .st-fadein { animation: fadein 0.5s ease-out; }
        @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        @media (prefers-reduced-motion: reduce) {
          .st-armed-pulse, .st-fadein { animation: none !important; }
        }
        .st-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: #8A8072; margin-top: 10px; }
        .st-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .st-lugtable { width: 100%; border-collapse: collapse; font-size: 13px; }
        .st-lugtable th { text-align: left; color: #8A8072; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; padding: 4px 6px; border-bottom: 1px solid #2E2519; }
        .st-lugtable td { padding: 6px; border-bottom: 1px solid #221B12; }
        .st-level-track { height: 6px; background: #171209; border-radius: 4px; overflow: hidden; flex: 1; }
        .st-level-fill { height: 100%; background: linear-gradient(90deg,#7FA65A,#C9A227); transition: width 0.08s linear; }
        .st-tip { font-size: 12.5px; color: #8A8072; line-height: 1.5; }
        .st-mic-error { font-size: 12.5px; color: #C1573A; background: rgba(193,87,58,0.1); border: 1px solid rgba(193,87,58,0.3); border-radius: 8px; padding: 8px 10px; margin-bottom: 12px; }
        select.st-input { appearance: none; }
      `}</style>

      <div className="st-root">
        <p className="st-eyebrow">Workbench</p>
        <h1 className="st-title">
          SHELL <span>&amp;</span> LUG
        </h1>

        {micError && <div className="st-mic-error">{micError}</div>}

        {/* Setup */}
        <div className="st-card">
          <div className="st-label">Drum</div>
          <div className="st-pillrow" style={{ marginBottom: 12 }}>
            {Object.entries(DRUM_PRESETS).map(([key, preset]) => (
              <button
                key={key}
                className={`st-pill ${drumType === key ? "active" : ""}`}
                onClick={() => setDrumType(key)}
              >
                {preset.label}
              </button>
            ))}
          </div>

          <div className="st-label">Diameter</div>
          <div className="st-pillrow" style={{ marginBottom: 12 }}>
            {DRUM_PRESETS[drumType].diameters.map((d) => (
              <button
                key={d}
                className={`st-pill ${diameter === d ? "active" : ""}`}
                onClick={() => setDiameter(d)}
              >
                {d}"
              </button>
            ))}
          </div>

          <div className="st-label">Lugs</div>
          <div className="st-pillrow">
            {[6, 8, 10, 12].map((n) => (
              <button
                key={n}
                className={`st-pill ${lugCount === n ? "active" : ""}`}
                onClick={() => setLugCount(n)}
              >
                {n}
              </button>
            ))}
          </div>
        </div>

        {/* Target */}
        <div className="st-card">
          <div className="st-row">
            <div>
              <div className="st-label" style={{ marginBottom: 4 }}>
                Target pitch{customMode ? " · custom" : " · suggested"}
              </div>
              <div className="st-target">
                {targetFreq.toFixed(1)} Hz <small>{freqToNote(targetFreq)}</small>
              </div>
            </div>
            <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
              <button className="st-nudge" onClick={() => nudgeTarget(-1)} aria-label="Lower target by a semitone">
                −
              </button>
              <button className="st-nudge" onClick={() => nudgeTarget(1)} aria-label="Raise target by a semitone">
                +
              </button>
            </div>
          </div>
          <div className="st-row" style={{ marginTop: 10 }}>
            <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
              <input
                className="st-input"
                type="number"
                placeholder="custom Hz"
                value={customInput}
                onChange={(e) => setCustomInput(e.target.value)}
              />
              <button className="st-btn secondary" onClick={applyCustomHz}>
                Set
              </button>
            </div>
            {customMode && (
              <button className="st-link-btn" onClick={revertToSuggested}>
                Revert to suggested
              </button>
            )}
          </div>
          <p className="st-tip" style={{ marginTop: 10 }}>
            Suggested pitches are a general starting point, not a rule — actual desirable tuning depends on head
            type, shell, and playing style.
          </p>
        </div>

        {/* Diagram + gauge */}
        <div className="st-card st-fadein">
          <div className="st-diagram-wrap">
            <svg viewBox="0 0 300 300" width="100%" style={{ maxWidth: 340 }}>
              <circle cx={cx} cy={cy} r={r + 26} fill="none" stroke="#26200F" strokeWidth="1" />
              <circle cx={cx} cy={cy} r={60} fill="#1A140C" stroke="#2E2519" strokeWidth="1" />

              {/* needle gauge */}
              <g transform={`rotate(${needleDeg} ${cx} ${cy})`}>
                <line
                  x1={cx}
                  y1={cy}
                  x2={cx}
                  y2={cy - 52}
                  stroke={listening && liveFreq ? lugColor(liveCents) : "#4A453D"}
                  strokeWidth="3"
                  strokeLinecap="round"
                />
              </g>
              <circle cx={cx} cy={cy} r="5" fill="#C9A227" />

              <text x={cx} y={cy + 20} textAnchor="middle" fontFamily="Oswald" fontSize="17" fontWeight="600" fill="#EDE6D8">
                {listening ? (liveFreq ? `${liveFreq.toFixed(1)} Hz` : "…") : "muted"}
              </text>
              <text x={cx} y={cy + 36} textAnchor="middle" fontFamily="Inter" fontSize="11" fill="#8A8072">
                {listening && liveCents != null ? statusLabel(liveCents) : listening ? "listening" : "start below"}
              </text>

              {lugPositions.map((p, i) => {
                const l = lugs[i];
                const cents = l && l.measured ? centsOff(l.freq, targetFreq) : null;
                const isArmed = armedIndex === i;
                return (
                  <g
                    key={i}
                    className="st-lug"
                    tabIndex={0}
                    role="button"
                    aria-label={`Lug ${i + 1}, ${ordinal(seqByIndex[i])} in tuning order, ${
                      l && l.measured ? statusLabel(cents) : "not measured"
                    }`}
                    onClick={() => armLug(i)}
                    onKeyDown={(e) => (e.key === "Enter" || e.key === " ") && armLug(i)}
                  >
                    {isArmed && (
                      <circle cx={p.x} cy={p.y} r="16" fill="none" stroke="#C9A227" strokeWidth="2" className="st-armed-pulse" />
                    )}
                    <circle className="visible" cx={p.x} cy={p.y} r="12" fill={lugColor(cents)} stroke="#171209" strokeWidth="1.5" />
                    <text x={p.x} y={p.y + 4} textAnchor="middle" fontFamily="Inter" fontSize="9.5" fontWeight="700" fill="#171209">
                      {seqByIndex[i]}
                    </text>
                  </g>
                );
              })}
            </svg>
          </div>

          <div className="st-row" style={{ marginTop: 6 }}>
            <span className="st-tip">Mic level</span>
            <div className="st-level-track" style={{ marginLeft: 8 }}>
              <div className="st-level-fill" style={{ width: `${listening ? levelPct : 0}%` }} />
            </div>
          </div>

          <div className="st-legend">
            <span>
              <span className="st-dot" style={{ background: "#7FA65A" }} /> in tune
            </span>
            <span>
              <span className="st-dot" style={{ background: "#C9A227" }} /> close
            </span>
            <span>
              <span className="st-dot" style={{ background: "#5B8CB8" }} /> flat
            </span>
            <span>
              <span className="st-dot" style={{ background: "#C1573A" }} /> sharp
            </span>
          </div>
        </div>

        {/* Selected lug */}
        <div className="st-card">
          {armedIndex != null ? (
            <>
              <div className="st-row">
                <div className="st-label" style={{ marginBottom: 0 }}>
                  Lug {armedIndex + 1} · {ordinal(seqByIndex[armedIndex])} to tune
                </div>
                {armedLug && armedLug.measured && (
                  <span style={{ fontSize: 12, color: lugColor(armedCents), fontWeight: 600 }}>
                    {armedLug.freq.toFixed(1)} Hz · {statusLabel(armedCents)}
                  </span>
                )}
              </div>
              <p className="st-tip" style={{ margin: "8px 0" }}>
                Press near this lug, about 1–2 inches in from the rim. If listening is on, the reading captures
                automatically. Or type a reading in by hand.
              </p>
              <div className="st-row">
                <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                  <input
                    className="st-input"
                    type="number"
                    placeholder="Hz"
                    value={manualHz}
                    onChange={(e) => setManualHz(e.target.value)}
                  />
                  <button className="st-btn secondary" onClick={saveManual}>
                    Save
                  </button>
                </div>
                <button
                  className="st-link-btn"
                  onClick={() => {
                    const remaining = tuningOrder.filter((idx) => idx !== armedIndex && !lugs[idx].measured);
                    armLug(remaining.length ? remaining[0] : null);
                  }}
                >
                  Skip this lug →
                </button>
              </div>
            </>
          ) : (
            <p className="st-tip">
              {allMeasured
                ? `All ${lugCount} lugs measured. Spread across the head: ${spread}¢ — ${spreadLabel}. Tap any lug above to re-check it.`
                : "Tap a lug on the diagram to measure it."}
            </p>
          )}
        </div>

        {/* Readout table */}
        {lugs.some((l) => l.measured) && (
          <div className="st-card">
            <div className="st-label">Readings</div>
            <table className="st-lugtable">
              <thead>
                <tr>
                  <th>Lug</th>
                  <th>Order</th>
                  <th>Reading</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
                {lugs.map((l, i) => {
                  const cents = l.measured ? centsOff(l.freq, targetFreq) : null;
                  return (
                    <tr key={i}>
                      <td>#{i + 1}</td>
                      <td>{ordinal(seqByIndex[i])}</td>
                      <td>{l.measured ? `${l.freq.toFixed(1)} Hz` : "—"}</td>
                      <td style={{ color: l.measured ? lugColor(cents) : "#5A5346" }}>{statusLabel(cents)}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
            {spread != null && (
              <p className="st-tip" style={{ marginTop: 10 }}>
                Spread across measured lugs: <strong style={{ color: "#EDE6D8" }}>{spread}¢</strong> ({spreadLabel}
                ). Evenness around the head usually matters more than hitting the target exactly.
              </p>
            )}
          </div>
        )}

        {/* Controls */}
        <div className="st-card">
          <div className="st-row">
            <button className="st-btn" onClick={listening ? stopListening : startListening}>
              {listening ? "Stop listening" : "Start listening"}
            </button>
            <button
              className="st-btn ghost"
              onClick={() => resetLugs(lugCount)}
            >
              Reset all lugs
            </button>
          </div>
          <div className="st-row" style={{ marginTop: 12 }}>
            <span className="st-label" style={{ marginBottom: 0 }}>
              Mic sensitivity
            </span>
            <div className="st-pillrow">
              {["low", "med", "high"].map((s) => (
                <button
                  key={s}
                  className={`st-pill ${sensitivity === s ? "active" : ""}`}
                  onClick={() => setSensitivity(s)}
                >
                  {s}
                </button>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<DrumTuner />);
</script>
</body>
</html>
